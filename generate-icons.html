<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Gerar Ícones</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 40px;
      max-width: 800px;
      margin: 0 auto;
    }
    h1 { color: #667eea; }
    .icon-preview {
      display: flex;
      gap: 20px;
      margin: 20px 0;
    }
    .icon-box {
      text-align: center;
    }
    canvas {
      border: 1px solid #ddd;
      border-radius: 8px;
    }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin: 10px 5px;
    }
    button:hover {
      opacity: 0.9;
    }
    .success {
      color: #4ade80;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>🎨 Gerador de Ícones - Lista de Compras</h1>
  <p>Clique nos botões abaixo para baixar os ícones nos tamanhos corretos.</p>

  <div class="icon-preview">
    <div class="icon-box">
      <h3>192x192</h3>
      <canvas id="canvas192" width="192" height="192"></canvas>
      <br>
      <button onclick="downloadIcon(192)">Baixar 192x192</button>
    </div>
    <div class="icon-box">
      <h3>512x512</h3>
      <canvas id="canvas512" width="512" height="512"></canvas>
      <br>
      <button onclick="downloadIcon(512)">Baixar 512x512</button>
    </div>
  </div>

  <div id="status"></div>

  <script>
    const svgContent = `
      <svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
          </linearGradient>
        </defs>
        <rect width="512" height="512" rx="110" fill="url(#bgGradient)"/>
        <g transform="translate(100, 80)">
          <path d="M 280 280 L 320 120 L 80 120 L 40 280 Z" fill="white" stroke="white" stroke-width="8"/>
          <path d="M 80 120 L 100 40 L 240 40 L 260 120" fill="none" stroke="white" stroke-width="12" stroke-linecap="round"/>
          <circle cx="100" cy="320" r="24" fill="white"/>
          <circle cx="260" cy="320" r="24" fill="white"/>
          <line x1="100" y1="160" x2="240" y2="160" stroke="rgba(102,126,234,0.4)" stroke-width="8" stroke-linecap="round"/>
          <line x1="100" y1="200" x2="220" y2="200" stroke="rgba(102,126,234,0.4)" stroke-width="8" stroke-linecap="round"/>
          <line x1="100" y1="240" x2="200" y2="240" stroke="rgba(102,126,234,0.4)" stroke-width="8" stroke-linecap="round"/>
          <circle cx="70" cy="160" r="8" fill="#4ade80"/>
          <circle cx="70" cy="200" r="8" fill="#4ade80"/>
          <circle cx="70" cy="240" r="8" fill="rgba(255,255,255,0.3)"/>
        </g>
      </svg>
    `;

    function renderIcon(size) {
      const canvas = document.getElementById(`canvas${size}`);
      const ctx = canvas.getContext('2d');
      const img = new Image();
      const svg = new Blob([svgContent], {type: 'image/svg+xml'});
      const url = URL.createObjectURL(svg);

      img.onload = function() {
        ctx.drawImage(img, 0, 0, size, size);
        URL.revokeObjectURL(url);
      };

      img.src = url;
    }

    function downloadIcon(size) {
      const canvas = document.getElementById(`canvas${size}`);
      canvas.toBlob(function(blob) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `icon-${size}.png`;
        a.click();
        URL.revokeObjectURL(url);

        document.getElementById('status').innerHTML = `<p class="success">✅ icon-${size}.png baixado! Mova para a pasta public/</p>`;
      });
    }

    // Renderizar ícones ao carregar a página
    window.onload = function() {
      renderIcon(192);
      renderIcon(512);
    };
  </script>
</body>
</html>
